name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-changes:
    name: native change detection
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test native change detection
        run: |
          git check-ignore -q .scratch || printf '\n.scratch/\n' >> "$(git rev-parse --git-path info/exclude)"
          python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Detect native changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/native_check.py "$BASE_SHA" "$HEAD_SHA"

  changeset:
    name: changeset
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') && !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - name: Require a release decision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          found=0
          while IFS= read -r path; do
            case "$path" in
              .changeset/*.md)
                if [ "$path" != ".changeset/README.md" ]; then
                  found=1
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- .changeset)
          if [ "$found" -ne 1 ]; then
            echo "Add a release note with 'bun changeset' or record no release impact with 'bun changeset --empty'." >&2
            exit 1
          fi
      - name: Validate changesets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun changeset status --since "$BASE_SHA"

  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [static, backend, frontend]
    env:
      NO_COLOR: "1"
      TIMELINE_REQUIRE_PULL_TESTS: ${{ matrix.suite == 'backend' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Require pinned Go for sidecar tests
        if: matrix.suite == 'static'
        run: ./tools/timeline-gmessages/build-bundled.sh --check
      # The remote-agents pull tests run timeline-export's bubblewrap sandbox,
      # which needs unprivileged user namespaces (restricted by AppArmor on Ubuntu 24.04).
      - name: Install remote-agents pull test tools
        if: matrix.suite == 'backend'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap rsync zip unzip
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run ${{ matrix.suite }} test suite
        run: ./test.sh "${{ matrix.suite }}"

  browser:
    uses: ./.github/workflows/browser-tests.yml
    with:
      chart-sweep: smoke

  macos-app:
    name: macOS app bundle
    needs: native-changes
    # Only an explicit, successful "false" decision permits a skip. A failed
    # checkout/test/detector or missing output still requests native coverage.
    if: ${{ !cancelled() && (contains(github.event.pull_request.labels.*.name, 'native-check') || needs.native-changes.result != 'success' || needs.native-changes.outputs.required != 'false') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: bun go
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: brew install webp
      - name: Build and smoke-test app
        working-directory: tools/timeline-app
        env:
          TIMELINE_CODESIGN_IDENTITY: '-'
          VITE_MAPTILER_API_KEY: 'ci-test'
        timeout-minutes: 20
        run: ./build.sh && ./smoke.sh --native-only

  source-service:
    name: source service boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - name: Smoke-test source service boot and shutdown
        run: ./scripts/smoke-service.sh

  service-artifact:
    uses: ./.github/workflows/service-artifact.yml

  upgrade:
    uses: ./.github/workflows/upgrade-check.yml
