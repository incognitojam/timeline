name: Service artifact

on:
  workflow_call:

permissions:
  contents: read

jobs:
  artifact:
    name: Linux service artifact
    runs-on: ubuntu-26.04
    container: swift:6.4.3-noble@sha256:4ed5e0210b244aab174450e0b79014c17db60c63c6daf0709347fe50c767293a
    env:
      VITE_MAPTILER_API_KEY: ci-test
    steps:
      - name: Install artifact smoke tools
        run: apt-get update && apt-get install -y --no-install-recommends curl python3
      - run: swiftc --version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: bun go
      - name: Trust the checkout for container Git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Build the relocatable service
        run: bun run build:service --output "$RUNNER_TEMP/timeline-service"
      - name: Smoke-test the relocatable service
        run: ./scripts/smoke-service-artifact.sh "$RUNNER_TEMP/timeline-service"
      - name: Test portable app logic and generated plists
        run: ./tools/timeline-app/test-portable.sh "$RUNNER_TEMP/timeline-service"
