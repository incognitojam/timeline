name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be built, published and pruned, without signing, publishing or deleting
        type: boolean
        default: true

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NO_COLOR: "1"
  # The rolling release whose only asset is the nightly update feed.
  FEED_TAG: nightly

jobs:
  select:
    # Scheduled runs wait for the repository variable; manual runs are explicit.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.NIGHTLY_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.select.outputs.build }}
      dry-run: ${{ steps.select.outputs.dry-run }}
      commit: ${{ steps.select.outputs.commit }}
      tag: ${{ steps.select.outputs.tag }}
      build-number: ${{ steps.select.outputs.build-number }}
      previous: ${{ steps.select.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose the newest green commit no nightly has shipped
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "dry-run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          releases="$RUNNER_TEMP/releases.json"
          gh api "repos/$GH_REPO/releases" --paginate --slurp > "$releases"
          last_nightly="$(python3 -B scripts/ci/nightly_release.py latest-nightly "$releases")"
          stable="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          stable_commit="$(git rev-parse "$stable^{commit}")"
          shipped=("$stable_commit")
          if [ -n "$last_nightly" ]; then
            nightly_commit="$(git rev-parse "$last_nightly^{commit}")"
            shipped+=("$nightly_commit")
          fi
          previous="${last_nightly:-$stable}"
          echo "Latest stable: $stable; latest nightly: ${last_nightly:-none}"

          commit=""
          while read -r sha; do
            for done_sha in "${shipped[@]}"; do
              if git merge-base --is-ancestor "$sha" "$done_sha"; then
                echo "$sha is already shipped; nothing newer is green."
                break 2
              fi
            done
            conclusion="$(gh api "repos/$GH_REPO/actions/workflows/trusted-ci.yml/runs?head_sha=$sha&event=push" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last | .conclusion // ""')"
            if [ "$conclusion" = success ]; then
              commit="$sha"
              break
            fi
            echo "Skipping $sha: Trusted CI ${conclusion:-has not finished}."
          done < <(git rev-list --first-parent --max-count=30 HEAD)

          if [ -z "$commit" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No new green commit on main; no nightly tonight." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Read the version and build number the candidate itself will build with.
          candidate="$RUNNER_TEMP/candidate"
          git worktree add --quiet --detach "$candidate" "$commit"
          build_number="$(cd "$candidate" && ./scripts/print-build-number.sh)"
          tag="$(python3 -B scripts/ci/nightly_release.py tag "$(jq -er .version "$candidate/package.json")")"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; one nightly a day. To recover a failed run, see docs/operations/releases.md#nightly-builds." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "build=true"
            echo "commit=$commit"
            echo "tag=$tag"
            echo "build-number=$build_number"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          # Plan pruning against the list as it will look once this nightly is published.
          after="$RUNNER_TEMP/releases-after.json"
          jq --arg tag "$tag" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + [[{tag_name: $tag, prerelease: true, draft: false, published_at: $now}]]' "$releases" > "$after"
          prune="$(python3 -B scripts/ci/nightly_release.py prune-plan "$after" --newest "$tag")"
          {
            echo "### Nightly $tag"
            echo
            echo "Commit \`$commit\`, build $build_number, changes since $previous."
            echo
            echo "Would prune after publishing: ${prune:-nothing}"
            if [ "$DRY_RUN" = true ]; then
              echo
              echo "**Dry run:** nothing was tagged, signed, published or deleted."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  draft:
    needs: select
    if: needs.select.outputs.build == 'true' && needs.select.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the commit and draft its prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.select.outputs.tag }}
          COMMIT: ${{ needs.select.outputs.commit }}
          PREVIOUS: ${{ needs.select.outputs.previous }}
        run: |
          python3 -B scripts/ci/nightly_release.py check-tag "$TAG"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Nightly build of \`$COMMIT\` from \`main\`. Not a stable release; see the [releases documentation](https://github.com/$GH_REPO/blob/main/docs/operations/releases.md#nightly-builds)."
            echo
            echo "Changes since $PREVIOUS:"
            echo
            # Code spans keep names such as @types/node from notifying GitHub users.
            # shellcheck disable=SC2016
            git log --first-parent --format='- %s' "$PREVIOUS..$COMMIT" | sed -E 's/(@[A-Za-z0-9_.\/-]+)/`\1`/g'
          } > "$notes"
          # Resumable: a re-run accepts a tag left by an earlier attempt only if it
          # names exactly this commit, and never moves a tag.
          if existing="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"' 2> "$RUNNER_TEMP/tag-error")"; then
            if [ "$existing" != "commit $COMMIT" ]; then
              echo "$TAG already exists as $existing, not commit $COMMIT." >&2
              exit 1
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/tag-error"; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" > /dev/null
          else
            cat "$RUNNER_TEMP/tag-error" >&2
            exit 1
          fi
          # Drafts are only visible in the full list, not by tag.
          existing="$(gh api "repos/$GH_REPO/releases" --paginate --slurp \
            | jq -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | {draft, prerelease}]')"
          case "$existing" in
            '[]') gh release create "$TAG" --draft --prerelease --verify-tag --title "$TAG" --notes-file "$notes" ;;
            '[{"draft":true,"prerelease":true}]') echo "Reusing the draft prerelease for $TAG." ;;
            *)
              echo "Unexpected releases for $TAG: $existing" >&2
              exit 1
              ;;
          esac

  macos-dmg:
    needs: [select, draft]
    permissions:
      contents: write
    uses: ./.github/workflows/macos-dmg.yml
    # Enables called-job environment secrets: https://github.com/actions/runner/issues/4453
    secrets: inherit
    with:
      tag: ${{ needs.select.outputs.tag }}
      commit: ${{ needs.select.outputs.commit }}
      nightly: true

  feed:
    needs: [select, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Point the nightly feed at the new prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.select.outputs.tag }}
          COMMIT: ${{ needs.select.outputs.commit }}
          BUILD: ${{ needs.select.outputs.build-number }}
        run: |
          feed="$RUNNER_TEMP/feed"
          gh release download "$TAG" --pattern appcast.xml --dir "$feed"
          python3 -B scripts/ci/nightly_release.py check-appcast "$feed/appcast.xml" \
            --repository "$GH_REPO" --tag "$TAG" --build "$BUILD"
          # A re-run on a later day must not point the feed back at an older nightly.
          releases="$RUNNER_TEMP/releases.json"
          gh api "repos/$GH_REPO/releases" --paginate --slurp > "$releases"
          newest="$(python3 -B scripts/ci/nightly_release.py latest-nightly "$releases")"
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest nightly ($newest is); leaving the feed alone." >&2
            exit 1
          fi
          if state="$(gh api "repos/$GH_REPO/releases/tags/$FEED_TAG" --jq '"\(.prerelease) \(.draft)"' 2> "$RUNNER_TEMP/feed-error")"; then
            if [ "$state" != "true false" ]; then
              echo "The $FEED_TAG release must be a published prerelease (prerelease, draft: $state)." >&2
              exit 1
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/feed-error"; then
            gh release create "$FEED_TAG" --prerelease --latest=false --target "$COMMIT" \
              --title "Nightly update feed" \
              --notes "Holds only the update feed for nightly builds. Do not delete it; see docs/operations/releases.md."
          else
            cat "$RUNNER_TEMP/feed-error" >&2
            exit 1
          fi
          gh release upload "$FEED_TAG" "$feed/appcast.xml" --clobber

  prune:
    needs: [select, feed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Delete nightlies older than the retention window
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.select.outputs.tag }}
        run: |
          releases="$RUNNER_TEMP/releases.json"
          gh api "repos/$GH_REPO/releases" --paginate --slurp > "$releases"
          # The plan is computed in full before anything is deleted; any doubt fails here.
          plan="$(python3 -B scripts/ci/nightly_release.py prune-plan "$releases" --newest "$TAG")"
          while read -r tag; do
            [ -n "$tag" ] || continue
            python3 -B scripts/ci/nightly_release.py check-tag "$tag"
            state="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '"\(.prerelease) \(.draft)"')"
            if [ "$state" != "true false" ]; then
              echo "$tag changed since planning (prerelease, draft: $state); stopping." >&2
              exit 1
            fi
            echo "Deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done <<< "$plan"
