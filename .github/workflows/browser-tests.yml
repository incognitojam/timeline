name: Browser tests

on:
  workflow_call:
    inputs:
      chart-sweep:
        description: Chart width coverage (smoke or full)
        type: string
        default: full

permissions:
  contents: read

jobs:
  browser:
    name: browser (${{ matrix.project }} ${{ matrix.dpr || matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [chart-month, chart-week, chart-year]
        dpr: ${{ fromJSON(inputs.chart-sweep == 'smoke' && '["both"]' || '[1,2]') }}
        include:
          - project: workflows
            shard: 1
          - project: workflows
            shard: 2
          - project: workflows
            shard: 3
    env:
      NO_COLOR: "1"
      PLAYWRIGHT_CHART_SWEEP: ${{ inputs.chart-sweep }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        if: matrix.project != 'workflows'
        working-directory: web
        run: bun install --frozen-lockfile
      # Cache the pinned browser and skip apt unless shared libraries are missing.
      - name: Resolve Playwright version
        id: playwright_version
        if: matrix.project != 'workflows'
        working-directory: web
        run: echo "version=$(bun -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        if: matrix.project != 'workflows'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium
        if: matrix.project != 'workflows' && steps.chromium_cache.outputs.cache-hit != 'true'
        working-directory: web
        run: bunx playwright install --only-shell chromium
      - name: Install missing Chromium system dependencies
        if: matrix.project != 'workflows'
        working-directory: web
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            bunx playwright install-deps chromium
          fi
      - name: Run chart sweep
        if: matrix.project != 'workflows'
        working-directory: web
        run: |
          args=(--project="${{ matrix.project }}")
          if [ "${{ matrix.dpr }}" != both ]; then
            args+=(--grep="DPR ${{ matrix.dpr }}")
          fi
          bun run test:e2e "${args[@]}"
      - name: Run browser workflow shard
        if: matrix.project == 'workflows'
        run: ./test.sh browser --project=workflows --shard="${{ matrix.shard }}/3"
      - name: Upload browser test report
        if: ${{ !cancelled() && hashFiles('web/playwright-report/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.dpr || matrix.shard }}
          path: web/playwright-report/
          retention-days: 14
