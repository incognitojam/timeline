name: macOS DMG

on:
  workflow_call:
    inputs:
      tag:
        description: The release the assets are for; an edge build names the rolling edge release
        required: true
        type: string
      commit:
        required: true
        type: string
      edge-version:
        description: Build this commit as an edge build (X.Y.Z-edge.BUILD) and save the signed files as an artifact
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (vX.Y.Z)
        required: true
        type: string
      commit:
        description: Full commit SHA the release tag must resolve to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dmg:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.edge-version != '' && inputs.commit || format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: bun go
          # Restore no cached binaries into a job holding write or signing credentials.
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # Edge builds are built from main as it stands, so their version exists only on the runner.
      - name: Stamp the edge version
        if: inputs.edge-version != ''
        env:
          EDGE_VERSION: ${{ inputs.edge-version }}
        run: |
          # Uses no repository script: the commit may predate it.
          if [[ "$EDGE_VERSION" != *-edge.* ]]; then
            echo "Not an edge version: $EDGE_VERSION" >&2
            exit 1
          fi
          jq --arg version "$EDGE_VERSION" '.version = $version' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
          # Keep the runner-only stamp out of version.json's dirty flag.
          git update-index --skip-worktree package.json
      - name: Verify release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          EDGE_VERSION: ${{ inputs.edge-version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor HEAD origin/main
          if [ -n "$EDGE_VERSION" ]; then
            # The version's build number must be the one this checkout builds with.
            test "${EDGE_VERSION##*.}" = "$(scripts/print-build-number.sh)"
            exit 0
          fi
          test "$RELEASE_TAG" = "v$(bun run scripts/print-product-version.ts)"
          releases="$(gh api "repos/$GH_REPO/releases" --paginate --slurp)"
          jq -e --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length == 1' <<< "$releases"
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != true ]; then
            echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Build app
        working-directory: tools/timeline-app
        env:
          TIMELINE_CODESIGN_IDENTITY: '-'
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
        run: TIMELINE_BUILD_NUMBER="$(../../scripts/print-build-number.sh)" ./build.sh
      - name: Sign, notarize, and package DMG
        working-directory: tools/timeline-app
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./package-dmg.sh
      - name: Generate signed update feed
        working-directory: tools/timeline-app
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./generate-appcast.sh
      - name: Save the signed edge build
        if: inputs.edge-version != ''
        uses: actions/upload-artifact@v7
        with:
          name: edge-${{ inputs.edge-version }}
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
            dist/macos/appcast.xml
          if-no-files-found: error
          retention-days: 7
      - name: Attach assets to draft release
        if: inputs.edge-version == ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)" = "$EXPECTED_COMMIT"
          releases="$(gh api "repos/$GH_REPO/releases" --paginate --slurp)"
          jq -e --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length == 1' <<< "$releases"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          # Rebuild the whole draft asset set on retries so signatures and checksums match the DMG.
          gh release upload "$RELEASE_TAG" dist/macos/*.dmg dist/macos/*.sha256 --clobber
          gh release upload "$RELEASE_TAG" dist/macos/appcast.xml --clobber
      - name: Publish the completed release
        if: inputs.edge-version == ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          releases="$(gh api "repos/$GH_REPO/releases" --paginate --slurp)"
          jq -e --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length == 1' <<< "$releases"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            # An older draft can finish after a newer stable release has shipped.
            latest="$(bun -e '
              const releases = (await Bun.stdin.json()).flat();
              const version = process.argv[1].replace(/^v/, "");
              const stable = releases.filter(r => !r.draft && !r.prerelease);
              const newer = stable.some(r => Bun.semver.order(r.tag_name.replace(/^v/, ""), version) > 0);
              console.log(!newer);
            ' "$RELEASE_TAG" <<< "$releases")"
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest="$latest"
          fi
