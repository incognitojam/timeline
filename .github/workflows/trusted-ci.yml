name: Trusted CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Require pinned Go for sidecar tests
        run: ./tools/timeline-gmessages/build-bundled.sh --check
      - run: ./test.sh static && ./test.sh unit

  browser:
    uses: ./.github/workflows/browser-tests.yml

  # Exercise the macOS local-first host: the menu bar app compiles and its
  # bundled service runs without the checkout.
  # CI must not register the SMAppService agent or touch the runner user's live
  # launchd/Login Items state. Uses only throwaway local credentials; macOS-only.
  macos-service:
    runs-on: macos-26
    env:
      NO_COLOR: "1"
      VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun go
      - run: bun install --frozen-lockfile
      - run: (cd web && bun install --frozen-lockfile)
      - name: Build the Timeline menu bar app
        env:
          TIMELINE_CODESIGN_IDENTITY: "-"
        run: (cd tools/timeline-app && ./build.sh)
      - name: Smoke-test the Timeline app bundle
        run: (cd tools/timeline-app && ./smoke.sh --native-only)

  source-service:
    name: source service boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - name: Smoke-test source service boot and shutdown
        run: ./scripts/smoke-service.sh

  service-artifact:
    uses: ./.github/workflows/service-artifact.yml
