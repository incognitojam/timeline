name: Measure Sparkle delta
on: workflow_dispatch
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          REPO_ROOT="$PWD"
          source tools/timeline-app/sparkle.sh
          mkdir -p .scratch
          git check-ignore -q .scratch
          cd .scratch
          for n in 1392 1394; do
            dmg="Timeline-0.21.1-edge.$n-macos-arm64.dmg"
            gh release download nightly --pattern "$dmg"
            hdiutil attach -readonly -nobrowse -mountpoint "$PWD/$n" "$dmg"
          done
          TIMEFORMAT='Elapsed %3R seconds'
          time "$SPARKLE_ROOT/bin/BinaryDelta" create --version=4 1392/Timeline.app 1394/Timeline.app patch.delta
          time {
            "$SPARKLE_ROOT/bin/BinaryDelta" apply 1392/Timeline.app patched.app patch.delta
            diff -qr 1394/Timeline.app patched.app
            codesign --verify --deep --strict patched.app
          }
          wc -c patch.delta *1394*.dmg
