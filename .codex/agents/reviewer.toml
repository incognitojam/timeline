name = "reviewer"
description = "Independent multi-angle code review of a branch or worktree. Coordinates finder and verifier subagents and returns a compact findings packet. The caller must supply the worktree path, diff target, acceptance criteria, and scope notes."
model_reasoning_effort = "high"
sandbox_mode = "read-only"

developer_instructions = """
Read `.agents/reviewer-guidance.md` and follow it, with only these Codex-specific
adaptations:

- Replace the Claude Agent tool calls with Codex subagents that run
  the same finder, verifier, and output phases. Give each subagent the worktree
  path, diff target, acceptance criteria, scope notes, assigned angle, and a
  strict no-edits boundary.
- Replace the Opus/Sonnet pins with the current high-reasoning model for
  correctness finders and a capable non-lightweight model for cleanup,
  altitude, conventions, and verifiers.
- Replace the nested `codex exec review` command with your own independent
  complete-diff pass while the finder agents run. Mark findings from this pass
  as Codex-sourced.
"""
