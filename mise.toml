# Development tools for this repository. `bun run setup` installs them; CI
# installs them with jdx/mise-action. Bun is pinned by `packageManager` in
# package.json, which mise reads below.
min_version = "2026.10.17"

[settings]
idiomatic_version_file_enable_tools = ["bun"]

[tools]
"aqua:rhysd/actionlint" = "1.7.12"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
sqlite = "3.54.1"
